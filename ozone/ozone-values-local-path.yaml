# Apache Ozone test deployment for IOMETE, for clusters without a default StorageClass.
# Chart: ozone-helm/ozone 0.3.0 (https://apache.github.io/ozone-helm-charts/)
#
# Volumes come from the local-path provisioner, which stores them on the node's disk under
# /opt/local-path-provisioner. Install it first:
#   kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
#
# local-path doesn't enforce volume sizes, so Ozone can use all free space on that disk.
# Single datanode, one copy of each object (no redundancy), no authentication.
# For testing only.

# Ozone runs as user "hadoop" (UID/GID 1000). fsGroup gives it write access to its
# persistent volumes, including volumes that are created owned by root.
securityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

env:
  # Keep one copy of each object, since there is only one datanode.
  - name: OZONE-SITE.XML_ozone.replication
    value: "1"
  - name: OZONE-SITE.XML_ozone.server.default.replication
    value: "1"
  # The chart hardcodes hdds.scm.safemode.min.datanode=3, and a second env entry with the
  # same name is rejected by Helm 4 server-side apply. A single datanode never satisfies it,
  # so disable safe mode instead.
  - name: OZONE-SITE.XML_hdds.scm.safemode.enabled
    value: "false"
  # Each datanode keeps 20GB free per volume by default. Lower the reserve for test-sized volumes.
  - name: OZONE-SITE.XML_hdds.datanode.volume.min.free.space
    value: "2GB"

om:
  replicas: 1
  persistence:
    enabled: true
    storageClassName: local-path
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 2Gi }

scm:
  replicas: 1
  persistence:
    enabled: true
    storageClassName: local-path
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 2Gi }

datanode:
  replicas: 1
  persistence:
    enabled: true
    storageClassName: local-path
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 2Gi }

# The S3 Gateway stays ClusterIP: without authentication, Ozone accepts any access key,
# so exposing it outside the cluster would expose all data. Use kubectl port-forward.
s3g:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
